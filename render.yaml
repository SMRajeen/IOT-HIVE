services:
  - type: web
    name: iot-hive
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --threads 2 --worker-class gthread --timeout 30"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SMS_GATEWAY
        value: "notifylk"
      - key: NOTIFY_LK_USER_ID
        sync: false
      - key: NOTIFY_LK_API_KEY
        sync: false
      - key: NOTIFY_LK_SENDER_ID
        value: "IOTHIVE"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "IoT HIVE <onboarding@resend.dev>"
